name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:0.8.1-pg17
        env:
          POSTGRES_USER: enercol
          POSTGRES_PASSWORD: enercol
          POSTGRES_DB: enercol_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U enercol -d enercol_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://enercol:enercol@localhost:5432/enercol_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv lock --check
      - run: uv sync --locked --group dev
      - run: uv run ruff check app alembic tests
      - run: uv run ruff format --check app alembic tests
      - run: uv run alembic check
        env:
          DATABASE_URL: postgresql+asyncpg://enercol:enercol@localhost:5432/enercol_test
      - run: uv run pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t enercol-api backend
      - run: docker build -t enercol-web frontend
