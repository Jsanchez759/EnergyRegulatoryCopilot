[project]
name = "enercol-api"
version = "0.2.0"
description = "API de investigación regulatoria energética colombiana"
requires-python = ">=3.11,<3.14"
dependencies = [
    "chromadb>=0.6.3,<0.7",
    "fastapi[standard]>=0.153.0,<0.154.0",
    "asyncer>=0.0.8,<1.0",
    "openai>=1.72.0,<2.0",
    "pydantic-settings>=2.8.1,<3.0",
    "pypdf>=5.4.0,<6.0",
    "python-multipart>=0.0.20,<1.0",
    "uvicorn[standard]>=0.34.0,<1.0",
    "llama-index-core>=0.14,<0.15",
    "llama-index-llms-openrouter>=0.4,<1.0",
    "httpx>=0.28,<1.0",
    "llama-index-embeddings-openai>=0.5,<1.0",
    "llama-index-vector-stores-chroma>=0.5,<1.0",
    "sqlalchemy[asyncio]>=2.0.40,<3.0",
    "aiosqlite>=0.21,<1.0",
    "alembic>=1.15,<2.0",
    "pwdlib[argon2]>=0.2,<1.0",
    "email-validator>=2.2,<3.0",
]

[dependency-groups]
dev = [
    "ruff>=0.11.0,<1.0",
]

[tool.uv]
package = false

[tool.fastapi]
entrypoint = "app.main:app"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "FAST"]
