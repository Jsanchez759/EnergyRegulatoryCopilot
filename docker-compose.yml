x-api-env: &api-env
  env_file: ./backend/.env
  environment:
    ENVIRONMENT: staging
    DATABASE_URL: postgresql+asyncpg://enercol:enercol@db:5432/enercol
    ALLOWED_ORIGINS: '["http://localhost:8080"]'
    # End-to-end runs sign up, approve and sign in an account per test.
    RATE_LIMIT_AUTH: 60/minute;600/hour

services:
  db:
    image: pgvector/pgvector:0.8.1-pg17
    environment:
      POSTGRES_USER: enercol
      POSTGRES_PASSWORD: enercol
      POSTGRES_DB: enercol
    ports:
      - "5432:5432"
    volumes:
      - enercol-pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U enercol -d enercol"]
      interval: 2s
      timeout: 3s
      retries: 30

  migrate:
    build: ./backend
    <<: *api-env
    command: ["sh", "-c", "alembic upgrade head && python -m app.corpus.cli install-queue"]
    depends_on:
      db:
        condition: service_healthy

  api:
    build: ./backend
    <<: *api-env
    ports:
      - "8000:8000"
    volumes:
      # Same directory as `make dev`, since both use the same database and job queue.
      - ./backend/storage/corpus:/app/storage/corpus
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    build: ./backend
    <<: *api-env
    command: ["python", "-m", "app.corpus.worker"]
    healthcheck:
      disable: true
    volumes:
      # Same directory as `make dev`, since both use the same database and job queue.
      - ./backend/storage/corpus:/app/storage/corpus
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:8000/api/v1
    ports:
      - "8080:8080"
    depends_on:
      api:
        condition: service_healthy

volumes:
  enercol-pgdata:
