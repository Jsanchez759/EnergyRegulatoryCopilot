services:
  api:
    build: ./backend
    env_file: ./backend/.env
    environment:
      ALLOWED_ORIGINS: '["http://localhost:8080"]'
    ports:
      - "8000:8000"
    volumes:
      - enercol-storage:/app/storage

  web:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:8000/api/v1
    ports:
      - "8080:8080"
    depends_on:
      api:
        condition: service_healthy

volumes:
  enercol-storage:
