server {
    listen 8080;
    root /usr/share/nginx/html;

    location /assets/ {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
